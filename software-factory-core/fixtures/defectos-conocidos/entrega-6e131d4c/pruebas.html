<!doctype html>
<meta charset="utf-8">
<title>Pruebas — esEmailValido (U1)</title>
<script src="./src/validar-email.js"></script>

<h1>esEmailValido — Acceptance Criteria de U1</h1>
<p id="resumen"></p>
<table id="tabla" border="1" cellpadding="6">
  <tr><th>Entrada</th><th>Esperado</th><th>Obtenido</th><th>Veredicto</th></tr>
</table>

<script>
  // Los casos son los Acceptance Criteria de la unidad: 5 direcciones
  // validas y 5 invalidas segun el criterio 1.
  const casos = [
    { entrada: "a@b.com", esperado: true },
    { entrada: "juan.perez@empresa.com.ar", esperado: true },
    { entrada: "nombre@dominio.io", esperado: true },
    { entrada: "user.name+tag@sub.dominio.com", esperado: true },
    { entrada: "x@y.co", esperado: true },
    { entrada: "texto-sin-arroba", esperado: false },
    { entrada: "@dominio.com", esperado: false },
    { entrada: "usuario@", esperado: false },
    { entrada: "usuario@dominio", esperado: false },
    { entrada: "usuario @dominio.com", esperado: false },
  ];

  let pasan = 0;
  const tabla = document.getElementById("tabla");

  for (const caso of casos) {
    const obtenido = esEmailValido(caso.entrada);   // se ejecuta la logica real
    const paso = obtenido === caso.esperado;
    if (paso) pasan++;

    const fila = tabla.insertRow();
    fila.style.background = paso ? "#d8f5d8" : "#f5d8d8";
    fila.insertCell().textContent = JSON.stringify(caso.entrada);
    fila.insertCell().textContent = JSON.stringify(caso.esperado);
    fila.insertCell().textContent = JSON.stringify(obtenido);
    fila.insertCell().textContent = paso ? "PASA" : "FALLA";
  }

  document.getElementById("resumen").textContent =
    pasan + " de " + casos.length + " criterios pasan.";
</script>
